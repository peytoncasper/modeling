<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="100" viewBox="0 0 240 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Elegant hand-drawn cursive "Niki" -->
  <g fill="none" stroke="#1a0f0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Capital N with flowing tail -->
    <path d="M 20 75 
             C 20 75, 22 65, 24 50
             C 26 35, 28 22, 32 20
             C 36 18, 38 22, 40 30
             C 44 45, 50 60, 55 70
             C 58 75, 60 72, 62 65
             C 64 55, 66 40, 68 30
             C 70 22, 74 20, 78 25"/>
    
    <!-- First i stem with connector -->
    <path d="M 78 25
             C 80 30, 82 40, 84 50
             C 86 60, 88 70, 92 72
             C 96 74, 100 70, 102 65"/>
    
    <!-- First i dot -->
    <circle cx="85" cy="18" r="3" fill="#1a0f0a" stroke="none"/>
    
    <!-- k with loop -->
    <path d="M 102 65
             C 104 60, 106 50, 108 40
             C 110 30, 112 22, 115 20
             C 118 18, 120 22, 118 30
             C 116 38, 125 42, 135 35
             C 140 32, 138 40, 135 48
             C 132 56, 140 65, 150 70
             C 155 72, 160 70, 162 65"/>
    
    <!-- Second i stem -->
    <path d="M 162 65
             C 164 55, 166 45, 168 38
             C 170 32, 174 30, 178 35
             C 182 42, 185 55, 188 65
             C 190 72, 195 75, 200 72"/>
    
    <!-- Second i dot -->
    <circle cx="172" cy="22" r="3" fill="#1a0f0a" stroke="none"/>
    
    <!-- Decorative flourish -->
    <path d="M 200 72
             C 205 68, 210 60, 215 55
             C 218 52, 220 54, 218 58"/>
  </g>
</svg>
