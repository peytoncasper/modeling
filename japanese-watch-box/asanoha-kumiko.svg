    <line x1="60" y1="13" x2="67.5" y2="26"/>
    <line x1="75" y1="13" x2="82.5" y2="26"/>
    
    <!-- DIAGONAL LINES - 60° up-left (from even row to odd row above) -->
    <!-- From y=-26 to y=-13 -->
    <line x1="-67.5" y1="-26" x2="-75" y2="-13"/>
    <line x1="-52.5" y1="-26" x2="-60" y2="-13"/>
    <line x1="-37.5" y1="-26" x2="-45" y2="-13"/>
    <line x1="-22.5" y1="-26" x2="-30" y2="-13"/>
    <line x1="-7.5" y1="-26" x2="-15" y2="-13"/>
    <line x1="7.5" y1="-26" x2="0" y2="-13"/>
    <line x1="22.5" y1="-26" x2="15" y2="-13"/>
    <line x1="37.5" y1="-26" x2="30" y2="-13"/>
    <line x1="52.5" y1="-26" x2="45" y2="-13"/>
    <line x1="67.5" y1="-26" x2="60" y2="-13"/>
    <line x1="82.5" y1="-26" x2="75" y2="-13"/>
    
    <!-- From y=-13 to y=0 -->
