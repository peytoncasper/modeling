<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     width="186mm" height="76mm" 
     viewBox="-93 -38 186 76">
  
  <style>
    .frame { fill: none; stroke: black; stroke-width: 0.5; }
    .bar { fill: none; stroke: black; stroke-width: 2; }
  </style>
  
  <!-- Outer frame -->
  <rect x="-93" y="-38" width="186" height="76" class="frame"/>
  
  <!-- Inner frame boundary -->
  <rect x="-90" y="-35" width="180" height="70" class="frame"/>
  
  <!-- Asanoha pattern - hexagonal grid with 60° lines -->
  <!-- Grid: 15mm horizontal spacing, 13mm vertical spacing (sin60 ratio) -->
  <!-- Even rows at y = -26, 0, 26 -->
  <!-- Odd rows at y = -13, 13 (offset by 7.5mm horizontally) -->
  
  <g class="bar">
    <!-- HORIZONTAL CONNECTIONS (between horizontally adjacent stars) -->
    <!-- Row y=-26 -->
    <line x1="-82.5" y1="-26" x2="-67.5" y2="-26"/>
    <line x1="-67.5" y1="-26" x2="-52.5" y2="-26"/>
    <line x1="-52.5" y1="-26" x2="-37.5" y2="-26"/>
    <line x1="-37.5" y1="-26" x2="-22.5" y2="-26"/>
    <line x1="-22.5" y1="-26" x2="-7.5" y2="-26"/>
    <line x1="-7.5" y1="-26" x2="7.5" y2="-26"/>
    <line x1="7.5" y1="-26" x2="22.5" y2="-26"/>
    <line x1="22.5" y1="-26" x2="37.5" y2="-26"/>
    <line x1="37.5" y1="-26" x2="52.5" y2="-26"/>
    <line x1="52.5" y1="-26" x2="67.5" y2="-26"/>
    <line x1="67.5" y1="-26" x2="82.5" y2="-26"/>
    
    <!-- Row y=0 -->
    <line x1="-82.5" y1="0" x2="-67.5" y2="0"/>
    <line x1="-67.5" y1="0" x2="-52.5" y2="0"/>
    <line x1="-52.5" y1="0" x2="-37.5" y2="0"/>
    <line x1="-37.5" y1="0" x2="-22.5" y2="0"/>
    <line x1="-22.5" y1="0" x2="-7.5" y2="0"/>
    <line x1="-7.5" y1="0" x2="7.5" y2="0"/>
    <line x1="7.5" y1="0" x2="22.5" y2="0"/>
    <line x1="22.5" y1="0" x2="37.5" y2="0"/>
    <line x1="37.5" y1="0" x2="52.5" y2="0"/>
    <line x1="52.5" y1="0" x2="67.5" y2="0"/>
    <line x1="67.5" y1="0" x2="82.5" y2="0"/>
    
    <!-- Row y=26 -->
    <line x1="-82.5" y1="26" x2="-67.5" y2="26"/>
    <line x1="-67.5" y1="26" x2="-52.5" y2="26"/>
    <line x1="-52.5" y1="26" x2="-37.5" y2="26"/>
    <line x1="-37.5" y1="26" x2="-22.5" y2="26"/>
    <line x1="-22.5" y1="26" x2="-7.5" y2="26"/>
    <line x1="-7.5" y1="26" x2="7.5" y2="26"/>
    <line x1="7.5" y1="26" x2="22.5" y2="26"/>
    <line x1="22.5" y1="26" x2="37.5" y2="26"/>
    <line x1="37.5" y1="26" x2="52.5" y2="26"/>
    <line x1="52.5" y1="26" x2="67.5" y2="26"/>
    <line x1="67.5" y1="26" x2="82.5" y2="26"/>
    
    <!-- Odd rows y=-13 -->
    <line x1="-75" y1="-13" x2="-60" y2="-13"/>
    <line x1="-60" y1="-13" x2="-45" y2="-13"/>
    <line x1="-45" y1="-13" x2="-30" y2="-13"/>
    <line x1="-30" y1="-13" x2="-15" y2="-13"/>
    <line x1="-15" y1="-13" x2="0" y2="-13"/>
    <line x1="0" y1="-13" x2="15" y2="-13"/>
    <line x1="15" y1="-13" x2="30" y2="-13"/>
    <line x1="30" y1="-13" x2="45" y2="-13"/>
    <line x1="45" y1="-13" x2="60" y2="-13"/>
    <line x1="60" y1="-13" x2="75" y2="-13"/>
    
    <!-- Odd rows y=13 -->
    <line x1="-75" y1="13" x2="-60" y2="13"/>
    <line x1="-60" y1="13" x2="-45" y2="13"/>
    <line x1="-45" y1="13" x2="-30" y2="13"/>
    <line x1="-30" y1="13" x2="-15" y2="13"/>
    <line x1="-15" y1="13" x2="0" y2="13"/>
    <line x1="0" y1="13" x2="15" y2="13"/>
    <line x1="15" y1="13" x2="30" y2="13"/>
