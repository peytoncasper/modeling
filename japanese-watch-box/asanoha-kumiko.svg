    <line x1="-30" y1="13" x2="-37.5" y2="26"/>
    <line x1="-15" y1="13" x2="-22.5" y2="26"/>
    <line x1="0" y1="13" x2="-7.5" y2="26"/>
    <line x1="15" y1="13" x2="7.5" y2="26"/>
    <line x1="30" y1="13" x2="22.5" y2="26"/>
    <line x1="45" y1="13" x2="37.5" y2="26"/>
    <line x1="60" y1="13" x2="52.5" y2="26"/>
    <line x1="75" y1="13" x2="67.5" y2="26"/>
    
    <!-- Edge connections to frame -->
    <!-- Left edge -->
    <line x1="-90" y1="-26" x2="-82.5" y2="-26"/>
    <line x1="-90" y1="0" x2="-82.5" y2="0"/>
    <line x1="-90" y1="26" x2="-82.5" y2="26"/>
    <line x1="-90" y1="-13" x2="-75" y2="-13"/>
    <line x1="-90" y1="13" x2="-75" y2="13"/>
    
    <!-- Right edge -->
    <line x1="82.5" y1="-26" x2="90" y2="-26"/>
    <line x1="82.5" y1="0" x2="90" y2="0"/>
    <line x1="82.5" y1="26" x2="90" y2="26"/>
    <line x1="75" y1="-13" x2="90" y2="-13"/>
    <line x1="75" y1="13" x2="90" y2="13"/>
    
    <!-- Top edge -->
    <line x1="-82.5" y1="26" x2="-82.5" y2="35"/>
    <line x1="-67.5" y1="26" x2="-67.5" y2="35"/>
    <line x1="-52.5" y1="26" x2="-52.5" y2="35"/>
    <line x1="-37.5" y1="26" x2="-37.5" y2="35"/>
    <line x1="-22.5" y1="26" x2="-22.5" y2="35"/>
    <line x1="-7.5" y1="26" x2="-7.5" y2="35"/>
