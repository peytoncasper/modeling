<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="186mm" height="76mm" viewBox="0 0 186 76">
  <defs>
    <!-- Asanoha unit cell - 6 pointed star pattern -->
    <pattern id="asanoha" x="0" y="0" width="20" height="17.32" patternUnits="userSpaceOnUse">
      <!-- Horizontal line -->
      <line x1="0" y1="8.66" x2="20" y2="8.66" stroke="black" stroke-width="1.5"/>
      <!-- Diagonal lines from center -->
      <line x1="10" y1="0" x2="10" y2="17.32" stroke="black" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="20" y2="17.32" stroke="black" stroke-width="1.5"/>
      <line x1="20" y1="0" x2="0" y2="17.32" stroke="black" stroke-width="1.5"/>
      <!-- Star center lines -->
      <line x1="0" y1="8.66" x2="10" y2="0" stroke="black" stroke-width="1.5"/>
      <line x1="10" y1="0" x2="20" y2="8.66" stroke="black" stroke-width="1.5"/>
      <line x1="0" y1="8.66" x2="10" y2="17.32" stroke="black" stroke-width="1.5"/>
      <line x1="10" y1="17.32" x2="20" y2="8.66" stroke="black" stroke-width="1.5"/>
    </pattern>
  </defs>
  
  <!-- Outer frame -->
  <rect x="0" y="0" width="186" height="76" fill="none" stroke="black" stroke-width="3"/>
  
  <!-- Inner frame -->
  <rect x="3" y="3" width="180" height="70" fill="url(#asanoha)" stroke="black" stroke-width="2"/>
</svg>

